name: Sync Upstream Formulas

on:
  schedule:
    # Run monthly on the 1st of each month at 18:00 UTC (03:00 KST)
    - cron: '0 18 1 * *'
  workflow_dispatch:
    inputs:
      formulas:
        description: 'Space-separated list of formula names to sync (e.g., "llvm gcc node@22")'
        required: false
        default: ''
      force:
        description: 'Force sync even if upstream and local versions match'
        required: false
        type: boolean
        default: false
      with_deps:
        description: 'Automatically resolve and register runtime dependencies to tap'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync:
    name: Check and Sync Formulas
    runs-on: ubuntu-latest

    steps:
      - name: Validate Personal Access Token (PAT)
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          if [ -z "$SYNC_PAT" ]; then
            echo "::error::Secret SYNC_PAT is not set! A Personal Access Token (PAT) is required so git pushes can trigger downstream workflows (like build.yml). Please see setup instructions."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          # Use SYNC_PAT instead of default GITHUB_TOKEN so git push triggers build.yml
          token: ${{ secrets.SYNC_PAT }}
          fetch-depth: 0

      - name: Configure Git Author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config commit.gpgsign false

      - name: Sync Formulas from Upstream
        id: sync
        env:
          FORMULAS: ${{ inputs.formulas || 'llvm gcc' }}
          FORCE_SYNC: ${{ inputs.force || 'false' }}
          WITH_DEPS: ${{ inputs.with_deps || 'false' }}
          GIT_BRANCH: 'main'
        run: |
          chmod +x scripts/*.sh
          EXTRA_ARGS=(--commit --push)
          if [ "${WITH_DEPS}" = "true" ]; then
            EXTRA_ARGS+=(--with-deps)
          fi
          ./scripts/sync_formulas.sh "${EXTRA_ARGS[@]}"
