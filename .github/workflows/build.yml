name: Build and Release Bottle

on:
  push:
    branches: [ main ]
    paths:
      - 'Formula/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: self-hosted
    
    steps:
    - name: 'Checkout'
      uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: 'Register repository as a Homebrew tap'
      run: |
        TAP_DIR="$(/usr/local/bin/brew --repository)/Library/Taps/jaewoook/homebrew-nal"
        mkdir -p "$(dirname "$TAP_DIR")"
        ln -sfn "$GITHUB_WORKSPACE" "$TAP_DIR"

    - name: 'Build package and create bottle'
      env:
        HOMEBREW_NO_AUTO_UPDATE: '1'
        HOMEBREW_NO_AUTOREMOVE: '1'
        HOMEBREW_NO_INSTALL_CLEANUP: '1'
        NONINTERACTIVE: '1'
      run: |
        # Identify which formula(s) were added or changed in the triggering commit
        CHANGED_FORMULAS=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep '^Formula/.*\.rb$' | sed 's|^Formula/||;s|\.rb$||' || true)
        
        # Fallback if no commit diff is available (e.g. manual dispatch or initial commit)
        if [ -z "$CHANGED_FORMULAS" ]; then
          CHANGED_FORMULAS=$(find Formula -maxdepth 1 -name "*.rb" -exec basename {} .rb \;)
        fi
        
        echo "Formulas to build: $CHANGED_FORMULAS"
        
        for FORMULA_NAME in $CHANGED_FORMULAS; do
          echo "=========================================="
          echo "Building $FORMULA_NAME..."
          echo "=========================================="
          
          # If formula is already installed (from homebrew/core or an earlier run),
          # uninstall it first to prevent cross-tap conflicts and ensure a clean bottle build
          if /usr/local/bin/brew list --formula --versions "$FORMULA_NAME" >/dev/null 2>&1; then
            echo "Uninstalling existing $FORMULA_NAME to prevent tap conflict..."
            /usr/local/bin/brew uninstall --ignore-dependencies "$FORMULA_NAME" || true
          fi

          # Install dependencies first (allows source-building unbottled dependencies)
          /usr/local/bin/brew install --only-dependencies "jaewoook/nal/$FORMULA_NAME"

          # Build formula for bottling, bypassing unbottled dependencies check
          /usr/local/bin/brew install --build-bottle --ignore-dependencies "jaewoook/nal/$FORMULA_NAME"
          /usr/local/bin/brew bottle --root-url="https://github.com/Jaewoook/homebrew-nal/releases/download/latest-build" --json "jaewoook/nal/$FORMULA_NAME"
        done

        # Merge generated bottle metadata into formula file(s)
        if compgen -G "*.bottle.json" > /dev/null; then
          echo "Merging bottle information into formula(s)..."
          /usr/local/bin/brew bottle --merge --write --no-commit *.bottle.json
        fi
        
    - name: Upload Bottle file to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        files: "*.tar.gz"
        tag_name: "latest-build"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Commit updated formula bottle block
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add Formula/*.rb
        if ! git diff --staged --quiet; then
          git commit -m "Add bottle block for prebuilt binaries [skip ci]"
          git pull --rebase origin main
          git push origin main
        fi

    - name: Clean up build artifacts and caches
      if: always()
      run: |
        echo "Cleaning up generated bottle archives from workspace..."
        rm -f *.tar.gz *.json
        
        echo "Pruning Homebrew cache and obsolete Cellar versions..."
        /usr/local/bin/brew cleanup --prune=all -s
