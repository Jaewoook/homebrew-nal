name: Build and Release Bottle

on:
  push:
    branches: [ main ]
    paths:
      - 'Formula/**'
      - 'Patches/**'
  workflow_dispatch:
    inputs:
      formula:
        description: 'Specific formula to build (e.g. "xz", "gcc", "llvm", or "all"). Multiple formulas can be separated by comma or space.'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  detect:
    name: Detect Formulas to Build
    runs-on: ubuntu-latest
    outputs:
      formulas: ${{ steps.detect.outputs.formulas }}
      count: ${{ steps.detect.outputs.count }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine target formulas
        id: detect
        run: |
          FORMULA_INPUT="${{ github.event.inputs.formula }}"
          TARGETS=()

          if [ -n "$FORMULA_INPUT" ]; then
            if [ "$FORMULA_INPUT" = "all" ]; then
              for f in Formula/*.rb; do
                [ -f "$f" ] || continue
                TARGETS+=("$(basename "$f" .rb)")
              done
            else
              CLEANED=$(echo "$FORMULA_INPUT" | tr ',' ' ')
              for name in $CLEANED; do
                if [ -f "Formula/${name}.rb" ]; then
                  TARGETS+=("$name")
                else
                  echo "::warning::Formula Formula/${name}.rb not found, skipping."
                fi
              done
            fi
          elif [ "${{ github.event_name }}" = "push" ]; then
            if [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
              CHANGED=$(git diff --name-only "${{ github.event.before }}" HEAD 2>/dev/null | grep -E '^(Formula/.*\.rb|Patches/)' | sed 's|^Formula/||;s|\.rb$||;s|^Patches/||;s|/.*||' | sort -u || true)
            else
              CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -E '^(Formula/.*\.rb|Patches/)' | sed 's|^Formula/||;s|\.rb$||;s|^Patches/||;s|/.*||' | sort -u || true)
            fi

            for name in $CHANGED; do
              if [ -f "Formula/${name}.rb" ]; then
                TARGETS+=("$name")
              fi
            done
          fi

          if [ ${#TARGETS[@]} -eq 0 ]; then
            JSON_ARRAY="[]"
            COUNT=0
          else
            JSON_ARRAY=$(printf '%s\n' "${TARGETS[@]}" | jq -R . | jq -s -c .)
            COUNT=${#TARGETS[@]}
          fi

          echo "Formulas to build: $JSON_ARRAY (count: $COUNT)"
          echo "formulas=$JSON_ARRAY" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

  build:
    name: Build Bottle (${{ matrix.formula }})
    needs: detect
    if: needs.detect.outputs.count != '0' && needs.detect.outputs.count != ''
    runs-on: self-hosted
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        formula: ${{ fromJson(needs.detect.outputs.formulas) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Register repository as a Homebrew tap
        run: |
          TAP_DIR="$(/usr/local/bin/brew --repository)/Library/Taps/jaewoook/homebrew-nal"
          mkdir -p "$(dirname "$TAP_DIR")"
          ln -sfn "$GITHUB_WORKSPACE" "$TAP_DIR"

      - name: Build package and create bottle
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_AUTOREMOVE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
          HOMEBREW_NO_ASK: '1'
          NONINTERACTIVE: '1'
        run: |
          FORMULA_NAME="${{ matrix.formula }}"
          echo "=========================================="
          echo "Building bottle for $FORMULA_NAME..."
          echo "=========================================="

          # Clean any lingering bottle archives from workspace
          rm -f *.bottle.tar.gz *.bottle.json

          # Uninstall existing formula if present to avoid cross-tap conflicts
          if /usr/local/bin/brew list --formula --versions "$FORMULA_NAME" >/dev/null 2>&1; then
            echo "Uninstalling existing $FORMULA_NAME to prevent tap conflict..."
            /usr/local/bin/brew uninstall --ignore-dependencies "$FORMULA_NAME" || true
          fi

          # Install dependencies first (allows source-building unbottled dependencies)
          /usr/local/bin/brew install --only-dependencies "jaewoook/nal/$FORMULA_NAME"

          # Determine formula version for release tag and title
          FORMULA_VERSION=$(/usr/local/bin/brew ruby -e 'puts Formula["jaewoook/nal/'"${FORMULA_NAME}"'"].pkg_version')
          RELEASE_TAG="${FORMULA_NAME}-${FORMULA_VERSION}"
          RELEASE_TITLE="${FORMULA_NAME} ${FORMULA_VERSION}"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=${RELEASE_TITLE}" >> "$GITHUB_ENV"
          echo "Prepared release target: $RELEASE_TITLE (tag: $RELEASE_TAG)"

          # Build formula for bottling
          /usr/local/bin/brew install --build-bottle "jaewoook/nal/$FORMULA_NAME"
          /usr/local/bin/brew bottle --root-url="https://github.com/Jaewoook/homebrew-nal/releases/download/${RELEASE_TAG}" --json "jaewoook/nal/$FORMULA_NAME"

          # Locate and merge bottle JSON metadata into formula
          BOTTLE_JSON=$(ls ${FORMULA_NAME}--*.bottle.json 2>/dev/null | head -n 1 || true)
          if [ -n "$BOTTLE_JSON" ] && [ -f "$BOTTLE_JSON" ]; then
            echo "Merging bottle information from $BOTTLE_JSON into Formula/${FORMULA_NAME}.rb..."
            /usr/local/bin/brew bottle --merge --write --no-commit "$BOTTLE_JSON"
          else
            echo "::error::Bottle JSON file not found for $FORMULA_NAME!"
            exit 1
          fi

      - name: Upload Bottle file to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: "${{ matrix.formula }}--*.tar.gz"
          tag_name: "${{ env.RELEASE_TAG }}"
          name: "${{ env.RELEASE_TITLE }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated formula bottle block
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add "Formula/${{ matrix.formula }}.rb"
          if ! git diff --staged --quiet; then
            git commit -m "Add bottle block for ${{ matrix.formula }} [skip ci]"
            # Pull and rebase cleanly now that working tree is clean
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit for ${{ matrix.formula }}."
          fi

      - name: Clean up build artifacts and caches
        if: always()
        run: |
          echo "Cleaning up generated bottle archives from workspace..."
          rm -f *.tar.gz *.json
          
          echo "Pruning Homebrew cache and obsolete Cellar versions..."
          /usr/local/bin/brew cleanup --prune=all -s
