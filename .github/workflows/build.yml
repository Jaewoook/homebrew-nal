name: Build and Release Bottle

on:
  push:
    branches: [ main ]
    paths:
      - 'Formula/**'
      - 'Casks/**'
      - 'Patches/**'
  workflow_dispatch:
    inputs:
      formula:
        description: 'Specific formula to build (e.g. "xz", "node", "node@22", or "all"). Multiple formulas can be separated by comma or space.'
        required: false
        default: ''
        type: string
      casks:
        description: 'Specific cask to mirror (e.g. "ghostty" or "all"). Multiple casks can be separated by comma or space.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: bottle-build
  cancel-in-progress: false

jobs:
  detect:
    name: Detect Formulas and Casks
    runs-on: ubuntu-latest
    outputs:
      formulas: ${{ steps.detect.outputs.formulas }}
      formula_count: ${{ steps.detect.outputs.formula_count }}
      casks: ${{ steps.detect.outputs.casks }}
      cask_count: ${{ steps.detect.outputs.cask_count }}
      count: ${{ steps.detect.outputs.count }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine target formulas and casks
        id: detect
        env:
          FORMULA_INPUT: ${{ github.event.inputs.formula }}
          CASK_INPUT: ${{ github.event.inputs.casks }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: bash scripts/detect_formulas.sh

  build:
    name: Build Bottle (${{ matrix.formula }})
    needs: detect
    if: needs.detect.outputs.formula_count != '0' && needs.detect.outputs.formula_count != ''
    runs-on: self-hosted
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        formula: ${{ fromJson(needs.detect.outputs.formulas) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          clean: true

      - name: Register repository as a Homebrew tap
        run: |
          BREW_CMD=(/usr/local/bin/brew)
          if [ "$(uname -m)" = "arm64" ] && command -v arch >/dev/null 2>&1; then
            BREW_CMD=(arch -x86_64 /usr/local/bin/brew)
          fi
          TAP_DIR="$("${BREW_CMD[@]}" --repository)/Library/Taps/jaewoook/homebrew-nal"
          mkdir -p "$(dirname "$TAP_DIR")"
          if [ -d "$TAP_DIR" ] && [ ! -L "$TAP_DIR" ]; then
            rm -rf "$TAP_DIR"
          fi
          ln -sfn "$GITHUB_WORKSPACE" "$TAP_DIR"
          "${BREW_CMD[@]}" trust --tap jaewoook/nal 2>/dev/null || true

      - name: Record host state before formula build
        env:
          FORMULA_NAME: ${{ matrix.formula }}
        run: bash scripts/restore_host_state.sh record-state formula "$FORMULA_NAME"

      - name: Build package and create bottle
        env:
          FORMULA_NAME: ${{ matrix.formula }}
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_AUTOREMOVE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: '1'
          HOMEBREW_NO_ASK: '1'
          NONINTERACTIVE: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/build_bottle.sh "$FORMULA_NAME"

      - name: Commit updated formula bottle block locally
        id: commit
        env:
          FORMULA_NAME: ${{ matrix.formula }}
          BOT_NO_PUSH: 'true'
        run: bash scripts/commit_bottle.sh "$FORMULA_NAME"

      - name: Check existing release state
        id: release_check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          state=$(gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json isDraft -q 'if .isDraft then "draft" else "published" end' 2>/dev/null || echo "missing")
          if [ "$state" = "published" ]; then
            echo "draft=false" >> "$GITHUB_OUTPUT"
            echo "created_draft=false" >> "$GITHUB_OUTPUT"
          else
            echo "draft=true" >> "$GITHUB_OUTPUT"
            echo "created_draft=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Bottle file to GitHub Releases
        id: upload
        uses: softprops/action-gh-release@v3
        with:
          files: "${{ matrix.formula }}-*.tar.gz"
          fail_on_unmatched_files: true
          tag_name: "${{ env.RELEASE_TAG }}"
          name: "${{ env.RELEASE_TITLE }}"
          draft: ${{ steps.release_check.outputs.draft == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push bottle commit and publish release
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CREATED_DRAFT: ${{ steps.release_check.outputs.created_draft }}
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          source scripts/formula_helpers.sh
          git_bot_push_main
          final_sha=$(git rev-parse HEAD)
          if [ "$CREATED_DRAFT" = "true" ]; then
            for attempt in 1 2 3; do
              if gh release edit "$RELEASE_TAG" --repo "${{ github.repository }}" --draft=false --target "$final_sha"; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Failed to publish draft release $RELEASE_TAG after pushing commit $final_sha." >&2
                exit 1
              fi
              sleep 2
            done
          fi

      - name: Clean up build artifacts and restore host state
        if: always()
        env:
          FORMULA_NAME: ${{ matrix.formula }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CREATED_DRAFT: ${{ steps.release_check.outputs.created_draft }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_ASK: '1'
          NONINTERACTIVE: '1'
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if [ -n "${RELEASE_TAG:-}" ] && [ "${CREATED_DRAFT:-false}" = "true" ] && [ "${PUBLISH_OUTCOME:-}" != "success" ]; then
            is_draft=$(gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json isDraft -q '.isDraft' 2>/dev/null || echo "false")
            if [ "$is_draft" = "true" ]; then
              gh release delete "$RELEASE_TAG" --repo "${{ github.repository }}" --yes 2>/dev/null || true
            fi
          fi
          bash scripts/restore_host_state.sh restore formula "$FORMULA_NAME"
          rm -f -- *.tar.gz *.json
          if [ "${PUBLISH_OUTCOME:-}" != "success" ] && git rev-parse --verify origin/main >/dev/null 2>&1; then
            git reset --hard origin/main 2>/dev/null || true
          fi
          git checkout -- . 2>/dev/null || true
          git clean -fd 2>/dev/null || true
          BREW_CMD=(/usr/local/bin/brew)
          if [ "$(uname -m)" = "arm64" ] && command -v arch >/dev/null 2>&1; then
            BREW_CMD=(arch -x86_64 /usr/local/bin/brew)
          fi
          "${BREW_CMD[@]}" cleanup --prune=all -s || true
          git config --local --unset-all user.name 2>/dev/null || true
          git config --local --unset-all user.email 2>/dev/null || true
          git config --local --unset-all user.signingkey 2>/dev/null || true
          git config --local --unset-all commit.gpgsign 2>/dev/null || true

  mirror-cask:
    name: Mirror Cask (${{ matrix.cask }})
    needs: [detect, build]
    if: ${{ !cancelled() && needs.detect.outputs.cask_count != '0' && needs.detect.outputs.cask_count != '' }}
    runs-on: self-hosted
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        cask: ${{ fromJson(needs.detect.outputs.casks) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          clean: true

      - name: Record host state before Cask mirror
        env:
          CASK_NAME: ${{ matrix.cask }}
        run: bash scripts/restore_host_state.sh record-state cask "$CASK_NAME"

      - name: Mirror Cask binary and rewrite Cask URL
        id: mirror
        env:
          CASK_NAME: ${{ matrix.cask }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/mirror_cask.sh "$CASK_NAME"

      - name: Commit updated Cask definition locally
        id: commit
        env:
          CASK_NAME: ${{ matrix.cask }}
          CASK_VERSION: ${{ steps.mirror.outputs.version }}
          BOT_NO_PUSH: 'true'
        run: bash scripts/commit_cask.sh "$CASK_NAME" "$CASK_VERSION"

      - name: Check existing release state
        id: release_check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          state=$(gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json isDraft -q 'if .isDraft then "draft" else "published" end' 2>/dev/null || echo "missing")
          if [ "$state" = "published" ]; then
            echo "draft=false" >> "$GITHUB_OUTPUT"
            echo "created_draft=false" >> "$GITHUB_OUTPUT"
          else
            echo "draft=true" >> "$GITHUB_OUTPUT"
            echo "created_draft=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Cask binary to GitHub Releases
        id: upload
        uses: softprops/action-gh-release@v3
        with:
          files: "${{ steps.mirror.outputs.cask_file }}"
          fail_on_unmatched_files: true
          tag_name: "${{ steps.mirror.outputs.release_tag }}"
          name: "${{ steps.mirror.outputs.release_title }}"
          draft: ${{ steps.release_check.outputs.draft == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Cask commit and publish release
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CREATED_DRAFT: ${{ steps.release_check.outputs.created_draft }}
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          source scripts/formula_helpers.sh
          git_bot_push_main
          final_sha=$(git rev-parse HEAD)
          if [ "$CREATED_DRAFT" = "true" ]; then
            for attempt in 1 2 3; do
              if gh release edit "$RELEASE_TAG" --repo "${{ github.repository }}" --draft=false --target "$final_sha"; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Failed to publish draft release $RELEASE_TAG after pushing commit $final_sha." >&2
                exit 1
              fi
              sleep 2
            done
          fi

      - name: Clean up Cask artifacts and restore host state
        if: always()
        env:
          CASK_NAME: ${{ matrix.cask }}
          CASK_FILE: ${{ steps.mirror.outputs.cask_file }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CREATED_DRAFT: ${{ steps.release_check.outputs.created_draft }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_ASK: '1'
          NONINTERACTIVE: '1'
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if [ -n "${RELEASE_TAG:-}" ] && [ "${CREATED_DRAFT:-false}" = "true" ] && [ "${PUBLISH_OUTCOME:-}" != "success" ]; then
            is_draft=$(gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json isDraft -q '.isDraft' 2>/dev/null || echo "false")
            if [ "$is_draft" = "true" ]; then
              gh release delete "$RELEASE_TAG" --repo "${{ github.repository }}" --yes 2>/dev/null || true
            fi
          fi
          bash scripts/restore_host_state.sh restore cask "$CASK_NAME"
          if [ -n "${CASK_FILE:-}" ]; then
            rm -f -- "$CASK_FILE"
          fi
          if [ "${PUBLISH_OUTCOME:-}" != "success" ] && git rev-parse --verify origin/main >/dev/null 2>&1; then
            git reset --hard origin/main 2>/dev/null || true
          fi
          git checkout -- . 2>/dev/null || true
          git clean -fd 2>/dev/null || true
          git config --local --unset-all user.name 2>/dev/null || true
          git config --local --unset-all user.email 2>/dev/null || true
          git config --local --unset-all user.signingkey 2>/dev/null || true
          git config --local --unset-all commit.gpgsign 2>/dev/null || true
