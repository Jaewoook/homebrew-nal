name: Normalize Release Bottle Filenames

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-release-assets.yml'

permissions:
  contents: write

jobs:
  normalize-assets:
    name: Normalize Release Bottle Filenames
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Normalize bottle filenames on GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching releases for Jaewoook/homebrew-nal..."
          TAGS=$(gh release list -R Jaewoook/homebrew-nal --limit 100 --json tagName -q '.[].tagName')
          
          for TAG in $TAGS; do
            echo "=========================================="
            echo "Processing release: $TAG"
            echo "=========================================="
            
            # Fetch asset names
            ASSETS=$(gh release view "$TAG" -R Jaewoook/homebrew-nal --json assets -q '.assets[].name' || true)
            
            for ASSET in $ASSETS; do
              if [[ "$ASSET" == *"--"*".tar.gz" ]]; then
                TARGET="${ASSET/--/-}"
                echo "Found double-dash asset: $ASSET"
                echo "Target normalized name:  $TARGET"
                
                # Check if target already exists
                if echo "$ASSETS" | grep -qx "$TARGET"; then
                  echo "Target $TARGET already exists on release $TAG, skipping."
                  continue
                fi
                
                echo "Downloading $ASSET..."
                if ! gh release download "$TAG" -R Jaewoook/homebrew-nal -p "$ASSET" -D . --clobber; then
                  echo "Failed to download $ASSET, skipping."
                  continue
                fi
                
                echo "Renaming $ASSET -> $TARGET..."
                cp "$ASSET" "$TARGET"
                
                echo "Uploading $TARGET to $TAG..."
                if gh release upload "$TAG" -R Jaewoook/homebrew-nal "$TARGET" --clobber; then
                  echo "Successfully uploaded $TARGET to $TAG!"
                else
                  echo "::warning::Failed to upload $TARGET to $TAG (release may be immutable)."
                fi
                
                rm -f "$ASSET" "$TARGET"
              fi
            done
          done
          echo "Finished processing all releases!"
